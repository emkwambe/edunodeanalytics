<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cyber Ocean Gradient -->
  <defs>
    <linearGradient id="paint0_linear" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Hexagonal Node Base -->
  <path d="M50 10L84.641 30V70L50 90L15.359 70V30L50 10Z" stroke="url(#paint0_linear)" stroke-width="4" stroke-linejoin="round"/>

  <!-- Central "E" Node -->
  <path d="M40 35H65M40 50H60M40 65H65M40 35V65" stroke="white" stroke-width="6" stroke-linecap="round"/>

  <!-- Data Pulse Dots -->
  <circle cx="50" cy="10" r="4" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="84.641" cy="70" r="4" fill="#6366f1"/>
  <circle cx="15.359" cy="70" r="4" fill="#6366f1"/>
</svg>
