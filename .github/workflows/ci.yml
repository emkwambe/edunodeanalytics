# GitHub Actions CI Workflow for EduNode Analytics
# Runs on every PR to main and on push to the development branch
# T3 CI/CD & Developer Velocity

name: CI

on:
  push:
    branches:
      - main
      - 'claude/edunode-analytics-saas-*'
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
