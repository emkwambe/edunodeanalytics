# ==============================================
# EduNode Analytics - dbt Project Configuration
# Transform messy SIS data into the unified EduNode Schema
# ==============================================

name: 'edunode_analytics'
version: '1.0.0'
config-version: 2

profile: 'edunode'

# Directory structure
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Variable definitions (tenant isolation)
vars:
  # These are overridden per-tenant at runtime
  tenant_id: "{{ env_var('DBT_TENANT_ID', 'demo') }}"
  academic_year: "{{ env_var('DBT_ACADEMIC_YEAR', '2024-2025') }}"

  # Chronic absenteeism threshold (configurable per state requirements)
  chronic_absence_threshold: 0.90  # < 90% = chronic

  # Early warning thresholds
  attendance_warning_threshold: 0.95
  attendance_critical_threshold: 0.90

# Model configurations
models:
  edunode_analytics:
    # Staging models - materialized as views
    staging:
      +materialized: view
      +schema: staging
      +tags: ['staging']

    # Intermediate models - ephemeral (CTEs)
    intermediate:
      +materialized: ephemeral
      +tags: ['intermediate']

    # Mart models (fact/dim tables) - materialized as tables
    marts:
      +materialized: table
      +schema: marts
      +tags: ['marts']

      # Partitioning for BigQuery performance
      core:
        +partition_by:
          field: snapshot_date
          data_type: date
          granularity: month

# Testing configurations
tests:
  edunode_analytics:
    +severity: warn

# Documentation
docs:
  edunode_analytics:
    +doc_file: docs.md

# Hooks for audit logging
on-run-start:
  - "{{ log_run_start() }}"
on-run-end:
  - "{{ log_run_end() }}"
